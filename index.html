<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반 친구들 수행평가 공지 보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-2">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-bullhorn"></i> 반 수행평가 공지 보드
      </h1>
      <div id="headerActions" class="flex flex-wrap gap-2 items-center">
        <!-- 친구들 화면에서는 보이지 않고, 관리자 모드일 때만 나타나는 버튼들 -->
        <div id="adminButtons" class="hidden flex gap-2">
          <button onclick="exportData()" class="bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-400 transition text-xs">
            <i class="fa-solid fa-download"></i> 백업
          </button>
          <button onclick="triggerImport()" class="bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-400 transition text-xs">
            <i class="fa-solid fa-upload"></i> 복구
          </button>
          <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">

          <button onclick="openSubjectModal()" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-600 transition text-xs">
            <i class="fa-solid fa-book"></i> 과목 관리
          </button>
          <button onclick="openModal()" class="bg-white text-indigo-600 px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-50 transition text-xs">
            <i class="fa-solid fa-plus"></i> 일정 추가
          </button>
        </div>

        <!-- 관리자 로그인/로그아웃 버튼 -->
        <button id="adminToggleBtn" onclick="toggleAdminMode()" class="bg-indigo-800/60 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg font-semibold transition text-xs flex items-center gap-1.5">
          <i class="fa-solid fa-lock" id="adminLockIcon"></i> <span id="adminBtnText">관리자 로그인</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Container -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- Top Banner: D-Day Widget -->
    <section id="ddayWidget" class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <!-- 동적 생성 영역 -->
    </section>

    <!-- Content Area -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Left / Filter & List -->
      <section class="lg:col-span-2 space-y-4">
        <div class="flex flex-wrap justify-between items-center gap-3 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0" id="subjectFilters">
            <!-- 동적 생성 영역 -->
          </div>
          <select id="sortOption" onchange="renderApp()" class="text-sm border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="due_asc">마감임박순</option>
            <option value="due_desc">마감여유순</option>
            <option value="priority">중요도순</option>
          </select>
        </div>

        <!-- 수행평가 카드 리스트 -->
        <div id="evalList" class="space-y-3">
          <!-- 동적 생성 영역 -->
        </div>
      </section>

      <!-- Right / Stats & Tips -->
      <section class="space-y-6">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
          <h3 class="font-bold text-gray-700 mb-3 text-sm flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-indigo-500"></i> 전체 진행 현황
          </h3>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-gray-50 p-3 rounded-lg">
              <span class="block text-xs text-gray-500">전체</span>
              <span id="statTotal" class="text-lg font-bold text-gray-700">0</span>
            </div>
            <div class="bg-blue-50 p-3 rounded-lg">
              <span class="block text-xs text-blue-500">진행 중</span>
              <span id="statProgress" class="text-lg font-bold text-blue-600">0</span>
            </div>
            <div class="bg-green-50 p-3 rounded-lg">
              <span class="block text-xs text-green-500">완료</span>
              <span id="statDone" class="text-lg font-bold text-green-600">0</span>
            </div>
          </div>
        </div>

        <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 text-sm text-indigo-900 space-y-2">
          <p class="font-bold flex items-center gap-2">
            <i class="fa-regular fa-lightbulb"></i> 이용 안내
          </p>
          <p class="text-xs text-indigo-700 leading-relaxed">
            반장(관리자)이 공지한 공식 수행평가 일정입니다. 우측 상단 <b>[관리자 로그인]</b>을 통해 비밀번호를 입력하면 직접 일정을 수정·추가하실 수 있습니다.
          </p>
        </div>
      </section>
    </div>
  </main>

  <!-- 과목 관리 모달 -->
  <div id="subjectModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-lg text-gray-800">과목 목록 관리</h3>
        <button onclick="closeSubjectModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="flex gap-2">
        <input type="text" id="newSubjectInput" placeholder="새 과목명 입력 (예: 물리)" class="flex-1 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addSubject()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg font-semibold transition">추가</button>
      </div>

      <div id="subjectManageList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
        <!-- 동적 생성 영역 -->
      </div>

      <div class="flex justify-end pt-2 border-t">
        <button onclick="closeSubjectModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-semibold rounded-lg">닫기</button>
      </div>
    </div>
  </div>

  <!-- 수행평가 등록/수정 모달 -->
  <div id="evalModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalTitle" class="font-bold text-lg text-gray-800">수행평가 등록</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <form id="evalForm" onsubmit="saveEval(event)" class="space-y-3">
        <input type="hidden" id="evalId">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">과목 선택 *</label>
          <select id="subjectSelect" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <!-- 동적 생성 영역 -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">수행평가 제목 *</label>
          <input type="text" id="title" required placeholder="예: 독후감 제출, 발표 준비" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">마감일 *</label>
            <input type="datetime-local" id="dueDate" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">중요도</label>
            <select id="priority" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="HIGH">상 (High)</option>
              <option value="MEDIUM" selected>중 (Medium)</option>
              <option value="LOW">하 (Low)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">세부 내용 및 메모</label>
          <textarea id="description" rows="3" placeholder="가이드라인, 준비사항 등을 적어두세요." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-semibold rounded-lg">취소</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow-sm">저장</button>
        </div>
      </form>
    </div>
  </div>

    function toggleAdminMode() {
      if (isAdmin) {

          isAdmin = false;

    // 백업 및 복구
    function exportData() {
      const data = { subjects: subjects, evals: evals, exportDate: new Date().toISOString() };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `eval_mate_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('importFile').click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.subjects && parsed.evals) {
            if (confirm('백업 파일의 데이터로 공지 일정을 덮어씌우시겠습니까?')) {
              subjects = parsed.subjects;
              evals = parsed.evals;
              currentFilter = 'ALL';
              renderApp();
              alert('데이터가 성공적으로 복구 및 반영되었습니다!');
            }
          } else {
            alert('올바른 백업 파일 형식이 아닙니다.');
          }
        } catch (err) {
          alert('JSON 파일을 읽는 중 오류가 발생했습니다.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function getDDay(dueDateStr) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const target = new Date(dueDateStr);
      target.setHours(0,0,0,0);
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      
      if (diff === 0) return 'D-Day';
      if (diff < 0) return `D+${Math.abs(diff)}`;
      return `D-${diff}`;
    }

    function renderApp() {
      saveToStorage();
      renderStats();
      renderDDayWidget();
      renderFilters();
      renderList();
    }

    function renderStats() {
      document.getElementById('statTotal').innerText = evals.length;
      document.getElementById('statProgress').innerText = evals.filter(e => e.status === 'IN_PROGRESS').length;
      document.getElementById('statDone').innerText = evals.filter(e => e.status === 'DONE').length;
    }

    function renderDDayWidget() {
      const widget = document.getElementById('ddayWidget');
      const pending = evals.filter(e => e.status !== 'DONE')
                           .sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));

      if (pending.length === 0) {
        widget.innerHTML = `
          <div>
            <h2 class="text-xl font-bold">🎉 모든 수행평가 일정이 완료되었습니다!</h2>
            <p class="text-sm opacity-90">수고하셨습니다.</p>
          </div>
        `;
        return;
      }

      const top = pending[0];
      const ddayText = getDDay(top.dueDate);

      widget.innerHTML = `
        <div>
          <span class="inline-block bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-2">🔥 가장 임박한 일정</span>
          <h2 class="text-2xl font-extrabold">[${top.subject}] ${top.title}</h2>
          <p class="text-sm opacity-90 mt-1"><i class="fa-regular fa-clock"></i> 마감: ${new Date(top.dueDate).toLocaleString('ko-KR', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' })}</p>
        </div>
        <div class="bg-white/10 backdrop-blur-md px-6 py-3 rounded-xl border border-white/20 text-center min-w-[120px]">
          <span class="block text-3xl font-black">${ddayText}</span>
          <span class="text-xs uppercase tracking-wider opacity-80">Remaining</span>
        </div>
      `;
    }

      container.innerHTML = filterSubjects.map(sub => `
        <button onclick="setFilter('${sub}')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${
          currentFilter === sub 
            ? 'bg-indigo-600 text-white shadow-sm' 
            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
        }">
          ${sub === 'ALL' ? '전체 보기' : sub}
        </button>
      `).join('');
    }

    function setFilter(sub) {
      currentFilter = sub;
      renderApp();
    }

    function renderList() {
      const container = document.getElementById('evalList');
      const sortOpt = document.getElementById('sortOption').value;

      let filtered = currentFilter === 'ALL' ? [...evals] : evals.filter(e => e.subject === currentFilter);

      filtered.sort((a,b) => {
        if(sortOpt === 'due_asc') return new Date(a.dueDate) - new Date(b.dueDate);
        if(sortOpt === 'due_desc') return new Date(b.dueDate) - new Date(a.dueDate);
        if(sortOpt === 'priority') {
          const map = { HIGH: 3, MEDIUM: 2, LOW: 1 };
          return map[b.priority] - map[a.priority];
        }
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-gray-400 border border-gray-100">등록된 수행평가가 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const dday = getDDay(item.dueDate);
        const isDone = item.status === 'DONE';
        const priorityBadge = item.priority === 'HIGH' ? 'bg-red-100 text-red-600' : item.priority === 'MEDIUM' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600';

        const subtasks = item.subtasks || [];
        const completedSubtasks = subtasks.filter(s => s.done).length;

        return `
          <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 space-y-4 transition hover:shadow-md ${isDone ? 'opacity-60 bg-gray-50' : ''}">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
              <div class="space-y-1 flex-1">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-indigo-50 text-indigo-600">${item.subject}</span>
                  <span class="px-2 py-0.5 rounded-md text-xs font-semibold ${priorityBadge}">${item.priority}</span>
                  <span class="text-xs font-bold text-red-500">${dday}</span>
                </div>
                <h4 class="font-bold text-gray-800 text-base ${isDone ? 'line-through' : ''}">${item.title}</h4>
                <p class="text-xs text-gray-500">${item.description || '세부 설명 없음'}</p>
                <p class="text-xs text-gray-400 pt-1"><i class="fa-regular fa-calendar"></i> ${item.dueDate.replace('T', ' ')} 까지</p>
              </div>

              <!-- 관리자 모드일 때만 수정/삭제/상태변경 컨트롤 노출 -->
              <div class="flex items-center gap-2 w-full md:w-auto justify-end border-t md:border-t-0 pt-2 md:pt-0">
                ${isAdmin ? `
                  <select onchange="updateStatus('${item.id}', this.value)" class="text-xs border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none">
                    <option value="TODO" ${item.status === 'TODO' ? 'selected' : ''}>시작 전</option>
                    <option value="IN_PROGRESS" ${item.status === 'IN_PROGRESS' ? 'selected' : ''}>진행 중</option>
                    <option value="DONE" ${item.status === 'DONE' ? 'selected' : ''}>완료</option>
                  </select>
                  <button onclick="editModal('${item.id}')" class="p-2 text-gray-400 hover:text-indigo-600 transition"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deleteEval('${item.id}')" class="p-2 text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-trash"></i></button>
                ` : `
                  <div class="text-xs font-bold px-3 py-1 bg-gray-100 text-gray-600 rounded-lg">
                    ${item.status === 'DONE' ? '완료됨' : item.status === 'IN_PROGRESS' ? '진행 중' : '시작 전'}
                  </div>
                `}
              </div>
            </div>

            <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 space-y-2">
              <div class="flex justify-between items-center text-xs font-semibold text-gray-600">
                <span><i class="fa-solid fa-list-check text-indigo-500"></i> 세부 체크리스트 (${completedSubtasks}/${subtasks.length})</span>
              </div>

              <div class="space-y-1.5">
                ${subtasks.map(s => `
                  <div class="flex items-center justify-between text-xs bg-white p-2 rounded border border-gray-100">
                    <label class="flex items-center gap-2 cursor-pointer flex-1">
                      <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask('${item.id}', '${s.id}')" class="rounded text-indigo-600 focus:ring-indigo-500">

                    </label>
                    ${isAdmin ? `
                      <div class="flex items-center gap-1">
                        <button onclick="editSubtask('${item.id}', '${s.id}')" class="text-gray-300 hover:text-indigo-600 px-1"><i class="fa-solid fa-pen text-[10px]"></i></button>

                  </div>

                <button onclick="addSubtask('${item.id}')" class="bg-indigo-500 hover:bg-indigo-600 text-white text-xs px-2.5 py-1 rounded font-semibold transition">추가</button>

    // 과목 관리
    function openSubjectModal() {
      renderSubjectManageList();
      document.getElementById('subjectModal').classList.remove('hidden');
      document.getElementById('subjectModal').classList.add('flex');
    }

    function closeSubjectModal() {
      document.getElementById('subjectModal').classList.add('hidden');
      document.getElementById('subjectModal').classList.remove('flex');
    }

    function renderSubjectManageList() {
      const container = document.getElementById('subjectManageList');
      if (subjects.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">등록된 과목이 없습니다.</p>`;
        return;
      }
      container.innerHTML = subjects.map((sub, idx) => `
        <div class="flex items-center justify-between p-2 bg-gray-50 rounded-lg border border-gray-100">
          <span class="text-sm font-semibold text-gray-700">${sub}</span>
          <div class="flex items-center gap-1">
            <button onclick="editSubject(${idx})" class="p-1.5 text-gray-400 hover:text-indigo-600 transition text-xs"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteSubject(${idx})" class="p-1.5 text-gray-400 hover:text-red-500 transition text-xs"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function addSubject() {
      const input = document.getElementById('newSubjectInput');
      const name = input.value.trim();
      if (!name) return;
      if (subjects.includes(name)) {
        alert('이미 존재하는 과목명입니다.');
        return;
      }
      subjects.push(name);
      input.value = '';
      renderSubjectManageList();
      renderApp();
    }

    function editSubject(index) {
      const oldName = subjects[index];
      const newName = prompt('수정할 과목명을 입력하세요:', oldName);
      if (!newName || !newName.trim() || newName === oldName) return;
      const trimmed = newName.trim();
      if (subjects.includes(trimmed)) {
        alert('이미 존재하는 과목명입니다.');
        return;
      }
      subjects[index] = trimmed;
      evals = evals.map(e => e.subject === oldName ? { ...e, subject: trimmed } : e);
      if (currentFilter === oldName) currentFilter = trimmed;
      renderSubjectManageList();
      renderApp();
    }

    function deleteSubject(index) {
      const targetName = subjects[index];
      if (confirm(`'${targetName}' 과목을 삭제하시겠습니까?`)) {
        subjects.splice(index, 1);
        if (currentFilter === targetName) currentFilter = 'ALL';
        renderSubjectManageList();
        renderApp();
      }
    }

    function populateSubjectSelect(selectedSubject = '') {
      const select = document.getElementById('subjectSelect');
      if (subjects.length === 0) {
        select.innerHTML = `<option value="">등록된 과목이 없습니다</option>`;
        return;
      }
      select.innerHTML = subjects.map(sub => `
        <option value="${sub}" ${sub === selectedSubject ? 'selected' : ''}>${sub}</option>
      `).join('');
    }

    function updateStatus(id, newStatus) {
      if (!isAdmin) return;
      evals = evals.map(e => e.id === id ? { ...e, status: newStatus } : e);
      renderApp();
    }

    function deleteEval(id) {
      if (!isAdmin) return;
      if (confirm('정말 삭제하시겠습니까?')) {
        evals = evals.filter(e => e.id !== id);
        renderApp();
      }
    }

    function addSubtask(evalId) {
      const input = document.getElementById(`subInput-${evalId}`);
      const text = input.value.trim();
      if (!text) return;

      evals = evals.map(e => {
        if (e.id === evalId) {
          const subtasks = e.subtasks || [];
          return {
            ...e,
            subtasks: [...subtasks, { id: Date.now().toString(), text, done: false }]
          };
        }
        return e;
      });
      renderApp();
    }

    function toggleSubtask(evalId, subtaskId) {
      evals = evalss = evals.map(e => {
        if (e.id === evalId) {
          const subtasks = e.subtasks.map(s => s.id === subtaskId ? { ...s, done: !s.done } : s);
          return { ...e, subtasks };
        }
        return e;
      });
      renderApp();
    }

    function editSubtask(evalId, subtaskId) {
      if (!isAdmin) return;
      evals = evals.map(e => {
        if (e.id === evalId) {
          const subtasks = e.subtasks.map(s => {
            if (s.id === subtaskId) {
              const newText = prompt('수정할 체크리스트 내용:', s.text);
              if (newText !== null && newText.trim() !== '') {
                return { ...s, text: newText.trim() };
              }
            }
            return s;
          });
          return { ...e, subtasks };
        }
        return e;
      });
      renderApp();
    }

    function deleteSubtask(evalId, subtaskId) {
      if (!isAdmin) return;
      evals = evals.map(e => {
        if (e.id === evalId) {
          const subtasks = e.subtasks.filter(s => s.id !== subtaskId);
          return { ...e, subtasks };
        }
        return e;
      });
      renderApp();
    }

    function openModal() {
      if (!isAdmin) return;
      if (subjects.length === 0) {
        alert('과목을 먼저 추가해주세요.');
        openSubjectModal();
        return;
      }
      document.getElementById('evalForm').reset();
      document.getElementById('evalId').value = '';
      document.getElementById('modalTitle').innerText = '수행평가 등록';
      populateSubjectSelect();
      document.getElementById('evalModal').classList.remove('hidden');
      document.getElementById('evalModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('evalModal').classList.add('hidden');
      document.getElementById('evalModal').classList.remove('flex');
    }

    function editModal(id) {
      if (!isAdmin) return;
      const target = evals.find(e => e.id === id);
      if(!target) return;
      document.getElementById('evalId').value = target.id;
      populateSubjectSelect(target.subject);
      document.getElementById('title').value = target.title;
      document.getElementById('dueDate').value = target.dueDate;
      document.getElementById('priority').value = target.priority;
      document.getElementById('description').value = target.description || '';
      document.getElementById('modalTitle').innerText = '수행평가 수정';
      document.getElementById('evalModal').classList.remove('hidden');
      document.getElementById('evalModal').classList.add('flex');
    }

    function saveEval(e) {
      e.preventDefault();
      if (!isAdmin) return;
      const id = document.getElementById('evalId').value;
      const subject = document.getElementById('subjectSelect').value;
      const title = document.getElementById('title').value;
      const dueDate = document.getElementById('dueDate').value;
      const priority = document.getElementById('priority').value;
      const description = document.getElementById('description').value;

      if (!subject) {
        alert('과목을 선택해주세요.');
        return;
      }

      if (id) {
        evals = evals.map(e => e.id === id ? { ...e, subject, title, dueDate, priority, description } : e);
      } else {
        const newEval = {
          id: Date.now().toString(),
          subject,
          title,
          dueDate,
          priority,
          status: 'TODO',
          description,
          subtasks: []
        };
        evals.push(newEval);
      }

      closeModal();
      renderApp();
    }

    // 초기 실행 시 관리자 권한 UI 반영
    updateAdminUI();
    renderApp();
  </script>
</body>
</html>
